<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Serif+Gurmukhi:wght@400;600&display=swap"
    />
    <title>Kirtan Player</title>
    <meta
      name="description"
      content="Search, play, and tag 20 years of kirtan from Sri Harmandir Sahib."
    />
  </head>
  <script>
    // Pre-paint, so a listener who chose Light never sees a dark flash.
    // Inline and un-bundled on purpose: anything the bundler touches arrives
    // after first paint, which is exactly what this exists to beat.
    (function () {
      try {
        // Two encodings live under this key: the Nuxt app wrote a bare
        // `dark`, and usehooks-ts writes a JSON `"dark"`. Comparing against
        // the bare form alone meant a listener who chose Dark in the React app
        // got a light flash on every load — the exact thing this script is
        // here to prevent. Strip the quotes and both read the same.
        var raw = localStorage.getItem('kp:theme') || 'system';
        var c = raw.charAt(0) === '"' ? raw.slice(1, -1) : raw;
        var dark =
          c === 'dark' ||
          (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        // Storage blocked. The class already on <html> stands.
      }
    })();
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
