# Netlify reads this file from the site's package directory (`apps/admin`), but
# runs its commands from the repo root — which is what the `ignore` path below
# has always relied on, since `scripts/` only resolves from there. So the
# command and publish path are root-relative too.
#
# Both used to live only in the dashboard, where they still described the Nuxt
# SSR app this repo no longer contains. They belong here: a netlify.toml
# overrides the UI, so deploy config now moves with the branch that changes it
# instead of needing two dashboards edited by hand at the right moment.
#
# Node comes from /.nvmrc, which Netlify finds because the base directory is
# the repo root. Pinning it again here would just be a second thing to forget.
[build]
  command = "pnpm build:admin"
  publish = "apps/admin/dist"
  ignore = "bash scripts/netlify-ignore.sh admin"

# BaniDB, proxied same-origin — and it must come before the SPA catch-all,
# because Netlify takes the first rule that matches.
#
# The code calls a relative `/banidb`, which only the Vite dev server was
# rewriting (`server.proxy`). In production the catch-all below answered it
# instead: every lookup got index.html with a 200, so `res.ok` was true and
# `res.json()` failed on "<!doctype html>". The read-along reported "Could not
# reach BaniDB" while BaniDB was perfectly reachable.
#
# Same-origin rather than calling api.banidb.com directly, for the reason in
# vite.config.ts: BaniDB caches its allow-origin header across origins, so a
# direct browser call can receive a response cached for somebody else and be
# blocked. The Nuxt app proxied it server-side; a static SPA has to do it here.
[[redirects]]
  from = "/banidb/*"
  to = "https://api.banidb.com/v2/:splat"
  status = 200
  force = true

# TanStack Router routes client-side, so every path has to reach index.html.
# Without this a reload on /search — or any link someone shared — is a 404
# from Netlify before the app ever loads.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
