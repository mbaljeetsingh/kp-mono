<!doctype html>
<html>
  <head>
    <!-- Play feature graphic (1024×500). Render: Chrome --headless --window-size=1024,500 --screenshot=play-feature-graphic.png feature-graphic.html (needs Google Fonts). -->
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: radial-gradient(120% 140% at 0% 0%, #b07a22 0%, #8f5c0f 45%, #5e3c0a 100%);
        font-family: Newsreader, Georgia, serif;
        color: #fcfaf5;
      }
      .icon {
        position: absolute;
        left: 72px;
        top: 104px;
        width: 100px;
        height: 100px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 0 0 2px rgba(252, 250, 245, 0.55),
          0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .icon img {
        width: 100%;
        height: 100%;
      }
      h1 {
        position: absolute;
        left: 68px;
        top: 236px;
        margin: 0;
        font-size: 68px;
        font-weight: 600;
        letter-spacing: -0.5px;
        line-height: 1;
      }
      p {
        position: absolute;
        left: 72px;
        top: 328px;
        margin: 0;
        width: 500px;
        font-size: 27px;
        line-height: 1.35;
        color: #f4e7c8;
      }
      .phone {
        position: absolute;
        left: 640px;
        top: 46px;
        width: 312px;
        height: 600px;
        border-radius: 44px;
        background: #1a1612;
        padding: 9px;
        box-sizing: border-box;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .phone img {
        width: 100%;
        border-radius: 36px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon"><img src="../../assets/images/icon.png" /></div>
    <h1>Kirtan Player</h1>
    <p>Twenty years of kirtan from Sri Harmandir Sahib, with the shabad to read along.</p>
    <div class="phone"><img src="ios-iphone/2-now-playing.png" /></div>
  </body>
</html>
