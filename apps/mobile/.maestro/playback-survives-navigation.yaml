# Playback must outlive a tab change.
#
# The whole reason this is a native app rather than a web page: the transport sits
# outside every screen so navigating never interrupts it. That arrangement has
# already been rebuilt twice — a hand-written tab bar, then NativeTabs.BottomAccessory
# — and both times the risk was the same. If the transport ends up inside a screen,
# it unmounts on the first tab change and the music stops.
#
# Nothing about that shows up in a type error.
appId: com.anonymous.kirtan-player
---
- launchApp:
    clearState: true

- assertVisible: 'Recently tagged'
# The row itself is the control — there is no separate play button on a phone,
# where the whole row is a comfortable target.
- tapOn: 'Mauli Dharati Maulia Akas'

# The transport picked it up.
- assertVisible:
    id: 'Pause'

# Walk the tabs. The transport is still there, still showing a pause control,
# which means the same audio is still playing.
- tapOn: 'Search'
- assertVisible:
    id: 'Pause'
- tapOn: 'Ragis'
- assertVisible:
    id: 'Pause'
- tapOn: 'Radio'
- assertVisible:
    id: 'Pause'
- tapOn: 'Saved'
- assertVisible:
    id: 'Pause'
