# Weekly: re-crawl sgpc.net and re-seed tracks, artists, and artist photos.
#
# The crawl is a full re-crawl by design (~670 requests, ~11 min) — incremental
# logic would cost the same requests and add a class of silently-missed
# changes; see README. Upserts are keyed on the content-derived track id, so
# re-running is always safe. New tracks simply join the untagged pool, where
# the scan queue and the tagger find them like anything else.
name: crawl
on:
  schedule:
    # Odd minute, deliberately. GitHub creates scheduled runs late under load,
    # and :00/:30 are the most contended slots on the hour. Measured here: every
    # scheduled run's created_at equals its run_started_at, so the run object is
    # not made until hours after the cron — the delay is in the dispatch, not in
    # waiting for a runner. align (30 2) started 09:18, 13:00, 14:31 UTC; scan
    # (30 1) started 08:02, 13:06, 11:43 despite finishing in a minute; crawl
    # (0 0) started 02:10. Moving off the round minute is GitHub's own documented
    # mitigation, not a guarantee — if the lag persists over a week or two, the
    # fix is an external trigger (repository_dispatch from a cron elsewhere), not
    # another minute. Do not tidy these back to :00.
    - cron: '13 6 * * 0'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @kp/crawler
      - run: node --experimental-strip-types packages/crawler/src/crawl.ts
      - run: node --experimental-strip-types packages/crawler/src/seed.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Artist roster and photos. Independent of the track crawl above — it
      # reads SGPC's cards.php, not the file listings — but the seeding order
      # matters: seed-artists links a photo with `update ... where name = ?`
      # and never inserts, so the artist rows seed.ts derives from the crawled
      # directories have to be in place first.
      #
      # ~204 photos at 400ms apiece, so roughly two minutes. The runner's disk
      # is empty every time, which is the point: crawl-artists skips whatever
      # is already cached, so on a persistent box a portrait SGPC *replaced*
      # would never be picked up, while here the whole set refreshes for free.
      - run: node --experimental-strip-types packages/crawler/src/crawl-artists.ts
      - run: node --experimental-strip-types packages/crawler/src/seed-artists.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
