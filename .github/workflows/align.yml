# Give published renditions their line timings.
#
# Started when there is work: a database trigger dispatches this workflow when
# a statement moves a rendition into the queue — a publish, or a re-cut or
# re-tag of a published one (supabase/migrations/
# 20260930000000_dispatch_scan_and_align.sql). The nightly schedule stays, as
# the sweep for anything a dispatch missed.
#
# The queue is data — published + shabad_id + line_timings null — so this job
# has no inputs, no ordering with the other workflows, and is safe to re-run:
# a crashed run simply leaves rows for the next one. Alignment deliberately
# waits for publish (verify first, then spend compute); see issue #30.
#
# CPU maths, measured on this runner type (run 36318552033, 4 vCPU) rather
# than estimated. A rendition is read off its recording's transcript — the
# scan's, in the transcripts bucket — and costs seconds. A recording with no
# transcript yet is transcribed once, whole, by the first rendition on it. The
# ASR model is a CTC conformer on onnxruntime: the long pass is one forward
# pass over the recording (RTF 0.075), the short pass runs each 8s window on
# its own (RTF 0.164) — ~0.24x the recording's duration in all, 8-9 minutes
# for a 35-minute duty, ~45 for a 3-hour Asa di Vaar. The fetch is seconds.
#
# So --limit 20 --deadline-min 60. Two different bounds, because neither is
# sufficient alone:
#
#   --limit 20 bounds renditions ALIGNED, not rows fetched. A rendition the
#   confidence gate refuses never gets timings, so it stays at the head of a
#   created_at.asc queue forever; counted against the limit it would retire one
#   of the night's slots permanently (see SKIP_BUDGET in write_timings.py).
#
#   --deadline-min 60 bounds the clock, which is what this timeout actually
#   enforces. The job projects what each recording it would have to
#   transcribe costs from its length (CI_RTF, rounded up) and defers what will
#   not fit. The first one of a run always goes; a 3-hour recording (~45
#   minutes) still ends inside timeout-minutes.
#
# History worth keeping: under surt-small-v3 (Whisper) this job was RTF ~6-9 —
# every window padded to a 30s mel input and re-encoded by both passes — and
# ran a limit of 3 with a 270-minute deadline inside 330 minutes. An earlier
# note here sized it off the Apple Silicon RTF instead and cancelled the
# nights of 27 and 28 Aug at the timeout. Measure on the runner before
# changing these numbers.
name: align
on:
  schedule:
    # Odd minute, deliberately. GitHub creates scheduled runs late under load,
    # and :00/:30 are the most contended slots on the hour. Measured here: every
    # scheduled run's created_at equals its run_started_at, so the run object is
    # not made until hours after the cron — the delay is in the dispatch, not in
    # waiting for a runner. align (30 2) started 09:18, 13:00, 14:31 UTC; scan
    # (30 1) started 08:02, 13:06, 11:43 despite finishing in a minute; crawl
    # (0 0) started 02:10. Moving off the round minute is GitHub's own documented
    # mitigation, not a guarantee — if the lag persists over a week or two, the
    # fix is an external trigger (repository_dispatch from a cron elsewhere), not
    # another minute. Do not tidy these back to :00.
    - cron: '47 5 * * *'
  workflow_dispatch:

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One run at a time: the queue has no claim, so two runs would align the
    # same renditions twice. GitHub keeps one waiting run per group and cancels
    # the older, which loses nothing — every run takes the whole queue — and it
    # is what turns ten publishes in a row into two runs rather than ten.
    concurrency:
      group: align
      cancel-in-progress: false
    defaults:
      run:
        working-directory: packages/aligner
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          # Without this every night re-downloads the same wheels (onnxruntime,
          # numpy) that changed zero times since the last run.
          enable-cache: true
          cache-dependency-glob: packages/aligner/pyproject.toml
      # The ASR model is 184 MB from Hugging Face; cache it or every night
      # starts with the same download. The key names the pinned revision
      # (runtime.REVISION): a cache hit never re-saves, so a key left over from
      # a previous model would restore that model forever and never store this
      # one.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-karansea-ctc-5fd2e89e
      # Both aligner scripts decode audio by shelling out to ffmpeg, and the
      # runner image does not carry it — the scan failed with a bare
      # "No such file or directory: 'ffmpeg'" and, because a failed track is
      # deliberately left queued for retry, every request stayed pending with
      # nothing to show for it. Declared here because nothing else declares it:
      # it is not a Python dependency, so uv cannot install it.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: uv venv && uv pip install -e .
      - run: uv run python write_timings.py --limit 20 --deadline-min 60
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}/rest/v1
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
