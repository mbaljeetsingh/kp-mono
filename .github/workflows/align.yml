# Nightly: give published renditions their line timings.
#
# The queue is data — published + shabad_id + line_timings null — so this job
# has no inputs, no ordering with the other workflows, and is safe to re-run:
# a crashed night simply leaves rows for the next one. Alignment deliberately
# waits for publish (verify first, then spend compute); see issue #30.
#
# CPU maths, measured on the runner rather than estimated. Cost is per ASR
# WINDOW, not per second of audio: Whisper pads every clip to a fixed 30s mel
# input, so an 8s window costs 7.8s of runner time and a 15s one 9.7s — nearly
# the same for double the audio. Each pass emits D/HOP windows, so a rendition
# of D seconds costs D/5 x 9.8 + D/2 x 8.0 ≈ 6D. RTF ≈ 6, and the hop-2 short
# pass is two thirds of it.
#
# So --limit 3 --deadline-min 270. Two different bounds, because neither is
# sufficient alone:
#
#   --limit 3 bounds renditions ALIGNED, not rows fetched. A rendition the
#   confidence gate refuses never gets timings, so it stays at the head of a
#   created_at.asc queue forever; counted against the limit it would retire one
#   of the night's slots permanently (see SKIP_BUDGET in write_timings.py).
#
#   --deadline-min 270 bounds the clock, which is what this timeout actually
#   enforces. A count cannot: three half-hour renditions is ~9 hours at RTF 6,
#   so --limit 3 alone would still be cancelled part-way. The job projects each
#   rendition's cost from its duration and defers what will not fit, leaving 60
#   minutes of headroom under timeout-minutes for the one already in flight.
#
# Three 10-minute sets is ~3 hours in practice. The timeout stays at 330 as a
# backstop, which is what it is now rather than the routine outcome.
#
# The note that used to sit here claimed RTF 2–2.5 and that --limit 10 bounded
# the night at "roughly 4 hours even if every rendition is a full hour-long
# set"; at the real RTF that is 10+ hours for 10-minute sets. It is why the
# nights of 27 and 28 Aug were cancelled at the timeout with renditions still
# queued, each losing the in-flight rendition's ASR.
name: align
on:
  schedule:
    # Odd minute, deliberately. GitHub creates scheduled runs late under load,
    # and :00/:30 are the most contended slots on the hour. Measured here: every
    # scheduled run's created_at equals its run_started_at, so the run object is
    # not made until hours after the cron — the delay is in the dispatch, not in
    # waiting for a runner. align (30 2) started 09:18, 13:00, 14:31 UTC; scan
    # (30 1) started 08:02, 13:06, 11:43 despite finishing in a minute; crawl
    # (0 0) started 02:10. Moving off the round minute is GitHub's own documented
    # mitigation, not a guarantee — if the lag persists over a week or two, the
    # fix is an external trigger (repository_dispatch from a cron elsewhere), not
    # another minute. Do not tidy these back to :00.
    - cron: '47 5 * * *'
  workflow_dispatch:

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: packages/aligner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Without this every night re-downloads the same 1-2 GB of wheels
          # (torch, transformers) that changed zero times since the last run.
          enable-cache: true
          cache-dependency-glob: packages/aligner/pyproject.toml
      # The ASR model is ~500 MB from Hugging Face; cache it or every night
      # starts with the same download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-surt-small-v3
      # Both aligner scripts decode audio by shelling out to ffmpeg, and the
      # runner image does not carry it — the scan failed with a bare
      # "No such file or directory: 'ffmpeg'" and, because a failed track is
      # deliberately left queued for retry, every request stayed pending with
      # nothing to show for it. Declared here because nothing else declares it:
      # it is not a Python dependency, so uv cannot install it.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: uv venv && uv pip install -e .
      - run: uv run python write_timings.py --limit 3 --deadline-min 270
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}/rest/v1
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
