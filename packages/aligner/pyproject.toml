# Python, in a TypeScript monorepo, on purpose: this package is where the ASR
# model lives, and the tooling around it is Python's. Nothing here
# runs in an app — like the crawler, it runs on cron (or by hand) and talks to
# Postgres. The apps only ever read the rows it writes.
[project]
name = "kp-aligner"
version = "0.1.0"
description = "Aligns Gurbani lines to kirtan audio; writes line_timings to Postgres"
requires-python = ">=3.11"
# No torch: the ASR model is an ONNX export run on onnxruntime's CPU provider,
# which is the whole reason a nightly run fits on a free runner.
dependencies = [
  "onnxruntime",
  "sentencepiece",
  "numpy",
  "huggingface_hub",
  "rapidfuzz",
  "soundfile",
]

# Flat modules, no package directory — setuptools auto-discovery refuses that
# layout and produces an EMPTY wheel (dist-info only), so `uv pip install -e .`
# fails in a clean environment and both nightly workflows would die at the
# install step. Declaring the modules explicitly is the whole fix. The two
# scripts are not listed: they are entry points run from this directory, not
# importable modules.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["align", "corpus", "matcher", "names", "runtime", "timing"]
